name: Supabase keepalive
on:
  schedule:
    - cron: "0 3 */3 * *"  # every 3 days, 3am UTC 
  workflow_dispatch: # trigger it manual to test
jobs:
  ping:
    runs-on: ubuntu-latest 
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/archives?limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"